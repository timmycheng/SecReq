name: 缺陷报告 (Bug)
description: 平台功能不符合预期的现象
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: 请先检索是否已有同类 issue, 避免重复。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 实际发生了什么? 期望发生什么?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 登录后进入…
        2. 点击…
        3. 看到…
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 版本与环境
      description: SecReq 版本号、部署方式(Docker/源码)、浏览器、数据库等
      placeholder: "v2.2.0, docker compose 部署, Chrome 140"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 服务日志、浏览器控制台报错或截图; 注意脱敏, 勿贴真实口令/密钥
    validations:
      required: false
