name: Retention

# 产物保留策略: GHCR 镜像版本与 Release 附件的定期清理。
#
# 背景(2026-08-30 实测): Release 附件 4 个版本共 275MB, 每版 +70MB;
# Actions 缓存 773MB/85 个。仓库为 private, 长期累积会逼近 1GB 软警告线。
# 清理只删"可重建"的产物: 代码、tag 与 GHCR 镜像源均在, 附件删了可从 GHCR 重新导出。
on:
  schedule:
    - cron: "0 3 * * 0"     # 每周日 03:00 UTC
  workflow_dispatch:
    inputs:
      keep_releases:
        description: "保留最近几个 Release 的附件"
        required: false
        default: "3"
      keep_minors:
        description: "保留最近几个 minor 版本的镜像"
        required: false
        default: "3"
      keep_vulndb:
        description: "保留最近几个日期版本的漏洞库 artifact"
        required: false
        default: "4"
      dry_run:
        description: "只报告将删除的内容(true/false)"
        required: false
        default: "true"

permissions:
  contents: write     # 删除 Release 附件
  packages: write     # 删除 GHCR 版本

jobs:
  ghcr-versions:
    name: 清理 GHCR 悬空与旧版本
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: secreq          # 应用镜像: 保留 latest + 最近 KEEP_MINORS 个 minor 的 patch
            mode: minors
          - package: secreq-vulndb   # 漏洞库 artifact: 保留 latest + 最近 KEEP_VULNDB 个日期版本
            mode: dates
    steps:
      - name: 列出待清理版本(${{ matrix.package }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          MODE: ${{ matrix.mode }}
          KEEP_MINORS: ${{ inputs.keep_minors || '3' }}
          KEEP_VULNDB: ${{ inputs.keep_vulndb || '4' }}
          # schedule 触发时 inputs 恒为空, 旧写法表达式恒 true → 周清理从未生效(#20);
          # 现定时即真实执行, 手动 dispatch 默认 dry-run
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run || 'true') }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          echo "当前 ${PACKAGE} 版本:"
          gh api --paginate "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
            --jq '.[] | "\(.id)\t\(.metadata.container.tags | join(","))"' | tee versions.tsv

          python - <<'PY' > to_delete.txt || true
          import os, re
          mode = os.environ.get("MODE", "minors")
          keep = int(os.environ.get("KEEP_MINORS", "3") if mode == "minors"
                     else os.environ.get("KEEP_VULNDB", "4"))
          rows = [l.rstrip("\n").split("\t") for l in open("versions.tsv") if l.strip()]

          def minor_of(tags):
              for t in tags:
                  m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", t)
                  if m: return f"{m.group(1)}.{m.group(2)}"
              return None

          def date_of(tags):
              for t in tags:
                  if re.fullmatch(r"\d{8}", t): return t
              return None

          pick = minor_of if mode == "minors" else date_of
          keys = sorted({k for _, t in rows for k in [pick(t.split(","))] if k},
                        key=(lambda x: tuple(int(v) for v in x.split("."))) if mode == "minors" else None,
                        reverse=True)
          keep_set = set(keys[:keep])
          out = []
          for vid, tags in rows:
              tag_list = [t for t in tags.split(",") if t]
              if not tag_list:
                  out.append(vid); continue          # 悬空版本
              if "latest" in tag_list: continue
              if pick(tag_list) in keep_set: continue
              out.append(vid)
          print("\n".join(out))
          PY

          echo "待删除版本: $(wc -l < to_delete.txt) 个"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry-run: 未执行删除"; exit 0
          fi
          while read -r id; do
            [ -z "$id" ] && continue
            gh api -X DELETE "/users/${OWNER}/packages/container/${PACKAGE}/versions/${id}" \
              || echo "::warning::删除版本 ${id} 失败"
          done < to_delete.txt

  release-assets:
    name: 清理旧 Release 附件
    runs-on: ubuntu-latest
    steps:
      - name: 删除超出保留窗口的镜像包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ inputs.keep_releases || '3' }}
          # schedule 触发时 inputs 恒为空, 旧写法表达式恒 true → 周清理从未生效(#20);
          # 现定时即真实执行, 手动 dispatch 默认 dry-run
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run || 'true') }}
        run: |
          set -euo pipefail
          # 按创建时间倒序, 跳过最近 KEEP 个 Release, 删除更旧 Release 上的镜像包。
          # 代码与 tag 保留, 镜像可从 GHCR 重新导出(docker pull + docker save)。
          ids=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
                  --jq '.[].id' | tail -n +$((KEEP + 1)))
          for id in $ids; do
            assets=$(gh api "repos/${{ github.repository }}/releases/${id}/assets" \
                      --jq '.[] | select(.name | startswith("secreq-image-")) | .id')
            for asset in $assets; do
              name=$(gh api "repos/${{ github.repository }}/releases/assets/${asset}" --jq '.name')
              if [ "${DRY_RUN}" = "true" ]; then
                echo "dry-run: 将删除附件 ${name}(Release ${id})"
              else
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${asset}" \
                  && echo "已删除附件 ${name}"
              fi
            done
          done
