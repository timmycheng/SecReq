name: CI

# push/PR 阶段的质量门禁: 后端测试 + 后端 Lint + 前端检查。
# 发版(tag)阶段的质量门禁在 release.yml, 两侧后端口径一致。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支推新提交时自动取消仍在跑的旧运行, 节省 Actions 时长
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # uv 大版本与 Dockerfile COPY 的 uv 镜像保持一致
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7"
          enable-cache: true

      # 锁文件与顶层声明必须同步: 改了 pyproject.toml 忘记 uv lock 会在这里失败
      - name: 校验锁文件同步
        run: uv lock --check

      # OSV 查询使用 MockTransport, 测试不出网
      - name: 运行测试
        run: uv run --frozen pytest tests -q

  backend-lint:
    name: 后端 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 口径见 ruff.toml: 只拦真实错误类(E4/E7/E9/F), 不做行宽与风格审判
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .

  e2e:
    name: E2E 主链路
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 后端经 uv 运行(playwright webServer 启动 uvicorn), 与其他 job 同口径
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7"
          enable-cache: true
      - name: 同步后端依赖
        run: uv sync --frozen

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      # 浏览器二进制按 playwright 版本缓存, 避免 CI 每次百 MB 下载
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: 安装 Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 构建前端产物
        working-directory: frontend
        run: npm run build

      - name: 运行 E2E 主链路
        working-directory: frontend
        run: npx playwright test

      - name: 上传失败痕迹
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  frontend-check:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"   # 与 Dockerfile 构建阶段一致
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # build 内含 tsc -b 全量类型检查
      - name: 构建
        working-directory: frontend
        run: npm run build
