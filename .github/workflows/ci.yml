name: CI

# PR 阶段全量质量门禁; push main 只保留后端快检作为合并交互兜底(#167):
# squash 进 main 的提交必然刚在 PR 里全绿过, 前端/E2E 在 main 上重跑近乎纯重复。
# 发版(tag)阶段的质量门禁在 release.yml, 两侧后端口径一致。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支推新提交时自动取消仍在跑的旧运行, 节省 Actions 时长
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs-only 改动跳过全部检查。注意必须用 job 级条件而不能用 workflow 级
  # paths-ignore: 后者被过滤时不会创建任何 check, 会卡死分支保护的必查状态
  # (docs-only PR 永远显示 waiting); job 被 if 跳过时报告 skipped, 视同成功。
  changes:
    name: 变更探测
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7

      - name: 探测是否 docs-only 改动
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs:
              - "**/*.md"
              - "docs/**"

  backend-check:
    name: 后端检查
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # uv 大版本与 Dockerfile COPY 的 uv 镜像保持一致
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7"
          enable-cache: true

      # 口径见 ruff.toml: 只拦真实错误类(E4/E7/E9/F), 不做行宽与风格审判
      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          args: check .

      # 锁文件与顶层声明必须同步: 改了 pyproject.toml 忘记 uv lock 会在这里失败
      - name: 校验锁文件同步
        run: uv lock --check

      # OSV 查询使用 MockTransport, 测试不出网
      - name: 运行测试
        run: uv run --frozen pytest tests -q

  e2e:
    name: E2E 主链路
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 后端经 uv 运行(playwright webServer 启动 uvicorn), 与其他 job 同口径
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7"
          enable-cache: true
      - name: 同步后端依赖
        run: uv sync --frozen

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      # 浏览器二进制按 playwright 版本缓存, 避免 CI 每次百 MB 下载
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: 安装 Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 构建前端产物
        working-directory: frontend
        run: npm run build

      - name: 运行 E2E 主链路
        working-directory: frontend
        run: npx playwright test

      - name: 上传失败痕迹
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # 只做 lint + 全量类型检查, 不跑 vite build: 构建产物由 E2E job 构建一次即可
  # (#167), 这里省掉的一次完整构建正是原 CI 里最大的重复开销。
  frontend-check:
    name: 前端检查
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"   # 与 Dockerfile 构建阶段一致
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # 全量类型检查(原 build 内含的 tsc -b 步骤单独拆出)
      - name: 类型检查
        working-directory: frontend
        run: npx tsc -b
