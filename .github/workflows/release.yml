name: Release

# 推送 v* 版本 tag 触发: 测试 → 构建并推送 GHCR 镜像 → 创建 Release 并附离线镜像包
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 创建 Release 与上传附件
  packages: write   # 推送镜像到 GHCR

# GHCR 镜像名必须小写
env:
  IMAGE: ghcr.io/timmycheng/secreq

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # OSV 查询使用 MockTransport, 测试不出网
      - name: 运行测试
        run: python -m pytest tests -q

  docker:
    name: 构建并推送镜像
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v2.1.0 → 镜像标签 2.1.0 / 2.1 / latest
      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 创建 Release 并附镜像包
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 提取对应版本的 CHANGELOG 章节并组装 Release 正文
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_NUM="${VERSION#v}"
          awk -v ver="$VERSION_NUM" '
            BEGIN { target = "## [" ver "]" }
            index($0, target) == 1 {flag=1; next}
            flag && /^## / {exit}
            flag
          ' CHANGELOG.md > changelog_section.md
          if [ ! -s changelog_section.md ]; then
            echo "::error::CHANGELOG.md 中未找到 [${VERSION_NUM}] 章节, 请先补充该版本变更再打 tag"
            exit 1
          fi
          sed -e "s|{{IMAGE}}|${IMAGE}|g" -e "s|{{VERSION_NUM}}|${VERSION_NUM}|g" \
            -e "s|{{VERSION}}|${VERSION}|g" .github/release-template.md > release_deploy.md
          cat changelog_section.md release_deploy.md > release_body.md

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 导出离线镜像包
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # 镜像 tag 为 semver 形态(无 v 前缀): metadata-action 对 vX.Y.Z 生成 X.Y.Z
          VERSION_NUM="${VERSION#v}"
          docker pull "${IMAGE}:${VERSION_NUM}"
          docker save "${IMAGE}:${VERSION_NUM}" | gzip > "secreq-image-${VERSION}.tar.gz"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: secreq-image-*.tar.gz
          body_path: release_body.md
          generate_release_notes: true
