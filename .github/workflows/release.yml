name: Release

# 推送 v* 版本 tag 触发: 测试 → 构建并推送 GHCR 镜像 → 创建 Release 并附离线镜像包
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 创建 Release 与上传附件
  packages: write   # 推送镜像到 GHCR

# GHCR 镜像名必须小写
env:
  IMAGE: ghcr.io/timmycheng/secreq
  VULNDB_IMAGE: ghcr.io/timmycheng/secreq-vulndb

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 发版前置一致性校验: tag ↔ main.py 版本 ↔ CHANGELOG 章节, 漂移即中止
      - name: 版本一致性校验
        run: python scripts/check_version.py "${{ github.ref_name }}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # OSV 查询使用 MockTransport, 测试不出网
      - name: 运行测试
        run: python -m pytest tests -q

  docker:
    name: 构建并推送镜像
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v2.1.0 → 镜像标签 2.1.0 / 2.1 / latest
      # 漏洞库基线走独立 OCI artifact, 绝不随 Release 附件分发(体积治理硬约束)。
      # 拉不到时放空文件占位: 镜像照常构建, 但漏洞查询会如实标注「无法判定」,
      # 而不是伪装成"未发现漏洞"。部署时挂载外部 vulndb.sqlite 即可覆盖。
      - uses: oras-project/setup-oras@v2

      - name: 拉取漏洞库基线
        run: |
          if oras pull "${VULNDB_IMAGE}:${VULNDB_TAG:-latest}"; then
            ls -lh vulndb.sqlite*
          else
            echo "::warning::未拉取到漏洞库基线, 镜像将不含基线库; 部署时需挂载外部 vulndb.sqlite 覆盖"
            : > vulndb.sqlite
            : > vulndb.sqlite.sha256
          fi

      # v2.1.0 → 镜像标签 2.1.0 / 2.1 / latest
      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min: 只缓存最终层。mode=max 会把全部中间层都存下来,
          # 实测累积到 773MB/85 个缓存, 跨版本无限堆积。
          cache-to: type=gha,mode=min

  release:
    name: 创建 Release 并附镜像包
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 提取对应版本的 CHANGELOG 章节并组装 Release 正文
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_NUM="${VERSION#v}"
          awk -v ver="$VERSION_NUM" '
            BEGIN { target = "## [" ver "]" }
            index($0, target) == 1 {flag=1; next}
            flag && /^## / {exit}
            flag
          ' CHANGELOG.md > changelog_section.md
          if [ ! -s changelog_section.md ]; then
            echo "::error::CHANGELOG.md 中未找到 [${VERSION_NUM}] 章节, 请先补充该版本变更再打 tag"
            exit 1
          fi
          sed -e "s|{{IMAGE}}|${IMAGE}|g" -e "s|{{VERSION_NUM}}|${VERSION_NUM}|g" \
            -e "s|{{VERSION}}|${VERSION}|g" .github/release-template.md > release_deploy.md
          cat changelog_section.md release_deploy.md > release_body.md

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 导出离线镜像包
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # 镜像 tag 为 semver 形态(无 v 前缀): metadata-action 对 vX.Y.Z 生成 X.Y.Z
          VERSION_NUM="${VERSION#v}"
          docker pull "${IMAGE}:${VERSION_NUM}"
          docker save "${IMAGE}:${VERSION_NUM}" | gzip > "secreq-image-${VERSION}.tar.gz"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: secreq-image-*.tar.gz
          body_path: release_body.md
          generate_release_notes: true

      # 只保留最近 3 个 Release 的镜像包: 每个约 70MB, private 仓库按版本累积
      # 很快就会逼近 1GB 软警告线。代码与 tag 不受影响, 镜像可从 GHCR 重新导出。
      - name: 清理旧 Release 附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          keep=3
          ids=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
                  --jq '.[].id' | tail -n +$((keep + 1)))
          for id in $ids; do
            assets=$(gh api "repos/${{ github.repository }}/releases/${id}/assets" \
                      --jq '.[] | select(.name | startswith("secreq-image-")) | .id')
            for asset in $assets; do
              name=$(gh api "repos/${{ github.repository }}/releases/assets/${asset}" --jq '.name')
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${asset}" \
                && echo "已删除旧附件 ${name}(Release ${id})"
            done
          done
