# SecReq HTTPS 反向代理模板
#
# 容器本身只提供 HTTP(EXPOSE 8000)。银行内网通常要求 HTTPS, 由前置代理终结 TLS,
# 后端无需改动。
#
# 用法:
#   1. 替换 server_name 与证书路径
#   2. 放到 Nginx 的 conf.d/ 下, 或在 docker-compose 中挂载:
#        - ./deploy/nginx/secreq.conf:/etc/nginx/conf.d/default.conf:ro
#        - ./certs:/etc/nginx/certs:ro
#   3. upstream 的 "secreq:8000" 需与后端容器的 compose 服务名一致
#   4. 后端需设置 FORWARDED_ALLOW_IPS 信任本代理(内网 compose 模板已内置),
#      否则后端忽略 X-Forwarded-For, 审计日志的 IP 记录的是本容器地址

upstream secreq {
    server secreq:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name secreq.corp.example;   # 改成实际域名
    return 301 https://$host$request_uri;
}

server {
    # 兼容写法: 1.18~1.24 可用; 1.25+ 仅告警(独立 http2 on 指令需 >= 1.25.1)
    listen 443 ssl http2;
    server_name secreq.corp.example;   # 改成实际域名

    ssl_certificate     /etc/nginx/certs/secreq.crt;
    ssl_certificate_key /etc/nginx/certs/secreq.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 需大于后端 MAX_UPLOAD_BYTES(5MB), 否则会先撞 Nginx 的 413
    # 而拿不到后端带说明的响应
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://secreq;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # 生成流程含漏洞查询, 耗时较长, 超时需放宽
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
