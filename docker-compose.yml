# SecReq 一键部署: docker compose up -d 后访问 http://localhost:8000
services:
  secreq:
    image: ghcr.io/timmycheng/secreq:latest  # 可固定为具体版本, 如 ghcr.io/timmycheng/secreq:v2.1.0
    container_name: secreq
    ports:
      - "8000:8000"
    environment:
      SECREQ_DATABASE_URL: sqlite:////app/data/secreq.db
    volumes:
      - secreq-data:/app/data     # SQLite 数据库
      - secreq-output:/app/output # 生成产物(SBOM JSON)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  secreq-data:
  secreq-output:
