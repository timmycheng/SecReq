# 版式参数模板(docs/templates/doc_style.yml)
# 用途: 安全中心可维护替换, 调整字体/字号/颜色无需改代码。
# docgen 服务读取本文件并按节合并代码内默认值; 删除个别键不影响生成。

fonts:
  body_cn: 宋体            # 正文中文字体
  heading_cn: 黑体         # 标题中文字体
  body_size_pt: 10.5       # 正文(五号)
  table_size_pt: 9         # 表格正文
  heading1_size_pt: 16     # 一级标题(一、二、三)
  heading2_size_pt: 13     # 二级标题(资产/ASVS分组等)

cover:
  title_size_pt: 26        # 封面主标题

colors:
  vuln_red: "C00000"       # 高危/严重漏洞标红
  header_shading: D9E2F3   # 表头底纹色

signature_roles: [编制人, 审核人]   # 封面签字栏顺序
