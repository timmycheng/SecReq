    priority: critical
    suggested_phase: design
    description: >
      资产「{{asset_name}}」带C3鉴别信息标签。传输环节强制国密/TLS1.2以上加密通道,
      展示环节禁止回显明文(密码/生物特征不可回显), 前端界面一律以掩码或占位符呈现,
      接口响应体不得携带C3明文。
    acceptance_criteria: >
      1)抓包不可见C3明文; 2)查询接口响应体无明文鉴别信息; 3)页面无明文回显。
    trigger_reason: "数据资产「{{asset_name}}」标记C3鉴别信息, 传输/展示环节禁止明文"
    regulatory_ref:
      - file: 个人金融信息保护技术规范
        clause: 参考(JR/T 0171-2020)
        summary: C3鉴别信息传输加密与禁止明文展示
        note: 待合规部门确认具体条文
      - file: 中华人民共和国个人信息保护法
