  - id: SEC-V2-005
    trigger: {type: policy_baseline, rule_key: password_strength}
    asvs_ref: "V2.1.12"
    title: 口令强度与轮换策略
    priority: critical
    suggested_phase: design
    description: >
      本项目({{grading_text}})口令策略: 最小长度{{pwd_min_length}}位,
      至少包含{{pwd_complexity}}类字符, 有效期{{pwd_valid_days}}天, 近{{pwd_history_limit}}次不得重复;
      新口令与最近使用口令相似度比对防增量篡改, 入库加盐慢哈希(bcrypt/SM3)不明文。
    acceptance_criteria: >
      设置弱口令被实时拒绝; 数据库表查询无明文口令; 改密历史检查生效。
    trigger_reason: "Step6密码策略设计器输出值"
