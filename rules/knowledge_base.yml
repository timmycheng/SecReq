  # 七、合规映射类
  # ────────────────────────────────────────────

  - id: SEC-CMP-701
    trigger: {type: compliance, target: djcp_l3}
    asvs_ref: "V1.1.1"
    title: 等保三级技术条款落实清单
    priority: high
    suggested_phase: design
    description: >
      项目按等保三级建设, 需在总体设计中逐条映射以下技术要求并提供证据物:
      三员分离管理、双因子管理员认证、全流量与关键区段入侵检测/防御、防病毒病毒库更新机制、
      异地数据备份与定期恢复演练、审计记录留存≥6个月、漏洞与补丁季度巡检闭环。
    acceptance_criteria: >
      设计书附《等保三级条款映射表》且不留空项; 测评前预评估高风险项全部闭环。
    trigger_reason: "定级问卷最终确认等级为三级"
    regulatory_ref:
      - file: 信息安全技术 网络安全等级保护基本要求(GB/T 22239-2019)
        clause: 第三级安全通用要求
        summary: 等保三级安全技术与管理制度全项要求
      - file: 中华人民共和国网络安全法
        clause: 第21条
        summary: 网络安全等级保护制度与日志留存

  - id: SEC-CMP-702
    trigger: {type: compliance, target: pipl}
    asvs_ref: "V8.1.1"
    title: 个人信息保护法专项条款核查
    priority: high
    suggested_phase: design
    description: >
      对照《个人信息保护法》第17/23/44-47/55条逐项自查: 隐私政策告知充分性、向第三方提供是否单独告知授权、
      自动化决策透明度、主体查阅复制更正删除响应渠道(15个工作日内)、对含敏感PII的处理活动开展个人信息保护影响评估PIA。
    acceptance_criteria: >
      官方隐私政策能定位每一处收集场景的说明; 客服工单演练主体权利请求在时限内闭环; PIA报告已完成签发。
    trigger_reason: "合规目标勾选了《个人信息保护法》且项目中存在PII资产"
    regulatory_ref:
      - file: 中华人民共和国个人信息保护法
        clause: 第17条
        summary: 处理前如实告知义务
      - file: 中华人民共和国个人信息保护法
        clause: 第44条至第47条
        summary: 主体查阅、复制、更正、删除等权利
      - file: 中华人民共和国个人信息保护法
        clause: 第55条
        summary: 事前个人信息保护影响评估

  - id: SEC-CMP-703
    trigger: {type: compliance, target: pci_dss}
    asvs_ref: "V6.4.3"
    title: 银行卡数据处理PCI-DSS核心条款
    priority: critical
    suggested_phase: design
    description: >
      涉卡环节满足PAN全程不落磁盘、显示截断至前6后4、索引文件亦不得全文留存;
      支付链路强制经PCI-DSS认证的通道商而不自研缓存; 季度ASV外部漏扫达标。
    acceptance_criteria: >
      渗透测试无法从库表/缓存/日志还原完整卡号; ASV季度扫描分数合格。
    trigger_reason: "合规目标勾选了PCI-DSS"
    regulatory_ref:
      - file: 支付卡行业数据安全标准(PCI DSS v4.0)
        clause: 要求3
        summary: 保护存储的账户数据(PAN不可读、展示截断)
      - file: 支付卡行业数据安全标准(PCI DSS v4.0)
        clause: 要求4
        summary: 强加密保护经公共网络传输的持卡人数据

