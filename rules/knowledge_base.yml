# ============================================================
# 安全需求知识库 v2.0(安全准入管理平台改造)
# 对齐标准: OWASP ASVS 4.0.3 / 网络安全等级保护2.0 / 个人信息保护法
#           JR/T 0197-2020 金融数据安全分级 / 金规〔2024〕24号
# 说明: {{xxx}} 为占位符, 由规则引擎用项目输入的实际值替换
# 触发器 trigger.type 枚举:
#   feature_category   功能分类命中
#   permission_rule    权限矩阵分析命中
#   auth_method        认证方式命中
#   policy_baseline    密码/会话策略(定级推导)
#   data_asset         数据资产/字典命中
#   api_endpoint       API接口属性命中
#   compliance         合规目标命中
#   vulnerability      SBOM漏洞命中
#   regulatory_trigger 监管报送触发器(命中即置顶, 需项目经理确认)
# regulatory_ref: 每条模板必须给出的监管出处; 具体条款号不确定时
#   写 "参考《文件名》" 并加 note: 待合规部门确认, 严禁编造条款号。
# ============================================================

meta:
  version: "2.0"
  asvs_version: "4.0.3"

templates:

  # ────────────────────────────────────────────
  # 〇、监管报送触发类 (SEC-REG, 命中即置顶)
  # ────────────────────────────────────────────

  - id: SEC-REG-001
    trigger: {type: regulatory_trigger, rule_key: l5_data_exists}
    asvs_ref: "V1.1.1"
    title: 重要数据识别与目录备案
    priority: critical
    suggested_phase: design
    description: >
      本项目存在5级(重要数据)资产: {{asset_list}}。按《银行保险机构数据安全管理办法》
      (金规〔2024〕24号)与《数据安全法》第30条要求, 须完成重要数据识别,
      形成重要数据目录并按要求向监管部门备案, 目录变更时同步更新。
    acceptance_criteria: >
      1)重要数据目录已登记上述资产并明确安全责任人; 2)备案回执或报送记录已归档;
      3)目录变更流程纳入配置管理。
    trigger_reason: "数据字典中存在5级(重要数据)资产「{{asset_list}}」, 触发重要数据目录备案义务"
    regulatory_ref:
      - file: 银行保险机构数据安全管理办法
        clause: 参考(金规〔2024〕24号)
        summary: 重要数据识别、目录与备案管理要求
        note: 待合规部门确认具体条文
      - file: 中华人民共和国数据安全法
        clause: 第30条
        summary: 重要数据处理者定期开展风险评估并报送风险评估报告

  - id: SEC-REG-002
    trigger: {type: regulatory_trigger, rule_key: cross_border_exists}
    asvs_ref: "V8.1.4"
    title: 数据出境安全评估申报
    priority: critical
    suggested_phase: design
    description: >
      {{cross_border_detail}}。按《数据出境安全评估办法》第四条情形,
      应当在开展数据出境活动前申报数据出境安全评估; 未通过评估的出境链路一律熔断,
      已签署标准合同条款或取得认证的须留存备案证明。
    acceptance_criteria: >
      1)申报材料或备案证明编号已归档; 2)出境链路在网关/DLP处单独标识并受控;
      3)法务出具可出境结论后方可开通链路。
    trigger_reason: "{{cross_border_detail}}, 触发数据出境安全评估申报义务"
    regulatory_ref:
      - file: 数据出境安全评估办法
        clause: 第4条
        summary: 应当申报数据出境安全评估的情形
      - file: 中华人民共和国个人信息保护法
        clause: 第38条
        summary: 向境外提供个人信息的法定条件

  - id: SEC-REG-004
    trigger: {type: regulatory_trigger, rule_key: mobile_app_type}
    asvs_ref: "V1.1.1"
    title: 移动应用程序台账登记
    priority: high
    suggested_phase: design
    description: >
      本项目形态为{{project_type_label}}。按《关于加强银行业保险业移动互联网应用程序管理的通知》
      要求, 移动应用程序须纳入行内台账统一登记管理(含名称、版本、分发渠道、责任部门),
      版本变更与下架同步维护, 并接受移动互联网应用程序安全检测。
    acceptance_criteria: >
      1)App/小程序信息已在行内台账登记; 2)各分发渠道信息与台账一致;
      3)上线前完成移动应用安全检测并留存报告。
    trigger_reason: "项目类型为{{project_type_label}}, 触发移动应用程序台账登记义务"
    regulatory_ref:
      - file: 关于加强银行业保险业移动互联网应用程序管理的通知
        clause: 参考
        summary: 移动互联网应用程序台账登记与全生命周期管理要求
        note: 待合规部门确认具体条文

  - id: SEC-REG-005
    trigger: {type: regulatory_trigger, rule_key: ai_feature}
    asvs_ref: "V1.2.4"
    title: 金融科技创新监管工具申报评估
    priority: high
    suggested_phase: design
    description: >
      项目包含AI功能「{{feature_list}}」。按JR/T 0199-2020《金融科技创新安全通用规范》
      及金融科技创新监管工具要求, 应用创新类金融科技服务须完成自评估并按规定申报,
      评估材料涵盖算法安全、数据使用与用户权益保护。
    acceptance_criteria: >
      1)创新应用自评估报告已完成; 2)按属地监管要求完成申报或备案;
      3)AI功能输出留痕可审计, 用户告知与拒绝机制可用。
    trigger_reason: "功能清单含AI功能「{{feature_list}}」, 触发金融科技创新监管申报评估"
    regulatory_ref:
      - file: 金融科技创新安全通用规范
        clause: 参考(JR/T 0199-2020)
        summary: 金融科技创新应用的安全通用要求与申报评估
        note: 待合规部门确认具体条文

  - id: SEC-REG-006
    trigger: {type: regulatory_trigger, rule_key: final_level_l3}
    asvs_ref: "V1.1.1"
    title: 重要信息系统投产变更报告
    priority: high
    suggested_phase: design
    description: >
      本项目定级为{{grading_text}}, 属重要信息系统范畴。按金融监管总局信息科技监管要求,
      重要信息系统的投产、重大变更须提前向监管部门报告(投产时间窗、回退方案、
      应急预案随报告一并提交)。
    acceptance_criteria: >
      1)投产/变更报告已按监管报送时限提交; 2)回退与应急预案随附并演练;
      3)报送回执归档。
    trigger_reason: "最终定级为{{grading_text}}, 触发重要信息系统投产变更报告义务"
    regulatory_ref:
      - file: 金融监管总局信息科技监管要求
        clause: 参考
        summary: 重要信息系统投产与重大变更报告要求
        note: 待合规部门确认具体文号与条文

  - id: SEC-REG-007
    trigger: {type: regulatory_trigger, rule_key: sensitive_pii_exists}
    asvs_ref: "V8.1.1"
    title: 个人信息保护影响评估(PIA)报告
    priority: high
    suggested_phase: design
    description: >
      本项目处理敏感个人信息(资产: {{asset_list}})。按《个人信息保护法》第55条,
      处理敏感个人信息应当事前进行个人信息保护影响评估, 评估报告与处理情况记录
      至少保存三年; 评估未通过不得开展处理活动。
    acceptance_criteria: >
      1)PIA报告覆盖上述资产的处理目的、方式、安全措施与权益影响;
      2)评估结论已签发并归档; 3)处理活动变更时重新评估。
    trigger_reason: "数据字典存在敏感个人信息资产「{{asset_list}}」, 触发事前PIA义务"
    regulatory_ref:
      - file: 中华人民共和国个人信息保护法
        clause: 第55条
        summary: 应当事前进行个人信息保护影响评估的情形
      - file: 中华人民共和国个人信息保护法
        clause: 第56条
        summary: 个人信息保护影响评估内容与留存要求(至少三年)

  - id: SEC-REG-008
    trigger: {type: regulatory_trigger, rule_key: djcp_l3_filing}
    asvs_ref: "V1.1.1"
    title: 等级保护测评与公安机关备案
    priority: high
    suggested_phase: design
    description: >
      本项目为等保{{grading_level}}系统。按《信息安全等级保护管理办法》
      (公通字〔2007〕43号)第十四条、第十五条, 第三级信息系统应当每年至少进行一次
      等级测评, 并在安全保护等级确定后30日内向县级以上公安机关备案。
    acceptance_criteria: >
      1)备案证明已取得并归档; 2)年度等保测评计划已排期, 测评机构具备资质;
      3)测评高风险项整改闭环后方可投产。
    trigger_reason: "定级为等保{{grading_level}}(或合规目标含等保三级), 触发测评与备案义务"
    regulatory_ref:
      - file: 信息安全等级保护管理办法
        clause: 第14条、第15条
        summary: 第三级系统年度测评与公安机关备案义务(公通字〔2007〕43号)
      - file: 中华人民共和国网络安全法
        clause: 第21条
        summary: 国家网络安全等级保护制度

  # ────────────────────────────────────────────
  # 一、功能触发类 (V5/V11/V12/V13)
  # ────────────────────────────────────────────

  - id: SEC-V12-001
    trigger: {type: feature_category, condition: {category: file_upload}}
    asvs_ref: "V12.1.1"
    title: 上传文件类型白名单校验
    priority: high
    suggested_phase: development
    description: >
      {{feature_name}}功能涉及文件上传。服务端必须基于文件内容(魔数)而非仅凭扩展名
      校验文件类型, 仅允许业务必需的白名单格式通过, 拒绝一切双扩展名、00截断等绕过手段。
    acceptance_criteria: >
      1)上传非白名单格式文件被拒绝且返回明确错误; 2)将恶意文件改名为白名单后缀上传,
      服务端可通过内容检测拦截; 3)拒绝响应不回显服务器路径。
    trigger_reason: "输入的功能清单中存在文件上传功能「{{feature_name}}」"
    regulatory_ref:
      - file: 信息安全技术 网络安全等级保护基本要求(GB/T 22239-2019)
        clause: 第三级安全通用要求
        summary: 入侵防范与恶意代码防范要求
      - file: 网上银行系统信息安全通用规范
        clause: 参考(JR/T 0068-2020)
        summary: 客户端与交易安全控制
        note: 待合规部门确认具体条文

  - id: SEC-V12-002
    trigger: {type: feature_category, condition: {category: file_upload}}
    asvs_ref: "V12.3.1"
    title: 上传文件大小与数量限制
    priority: medium
    suggested_phase: development
    description: >
      对{{feature_name}}功能的单文件大小、单次请求数量设置服务端硬性上限,
      并做总数配额控制, 防止以大文件耗尽磁盘与带宽的DoS攻击。
    acceptance_criteria: >
      超限上传被服务端拒绝(非前端校验); 限额数值与设计方案一致并写入设计文档。
    trigger_reason: "输入的功能清单中存在文件上传功能「{{feature_name}}」"
    regulatory_ref:
      - file: 信息安全技术 网络安全等级保护基本要求(GB/T 22239-2019)
        clause: 第三级安全通用要求
        summary: 资源控制与拒绝服务防护

  - id: SEC-V12-003
    trigger: {type: feature_category, condition: {category: file_upload}}
    asvs_ref: "V12.3.2"
    title: 上传文件存储隔离与不可执行化
    priority: critical
    suggested_phase: design
    description: >
      上传文件统一存放在应用根目录之外或对象存储桶中, 目录权限去除执行位;
      文件下载走统一的下载接口而非静态目录直链, 杜绝解析执行(Malicious File Execution)。
    acceptance_criteria: >
      直接以URL访问上传目录返回403/404; 上传HTML/SVG后访问不渲染脚本; nginx等网关无配置解析上传目录脚本。
    trigger_reason: "输入的功能清单中存在文件上传功能「{{feature_name}}」"
    regulatory_ref:
      - file: 信息安全技术 网络安全等级保护基本要求(GB/T 22239-2019)
        clause: 第三级安全通用要求
        summary: 访问控制与入侵防范

  - id: SEC-V12-004
    trigger: {type: feature_category, condition: {category: file_upload}}
    asvs_ref: "V12.4.1"
    title: 上传文件病毒查杀
    priority: high
    suggested_phase: development
    description: >
      上传文件落地前经病毒扫描引擎(ClamAV或商用杀毒引擎)异步查杀,
      未完成查杀前禁止被其他用户访问或转发下载。
    acceptance_criteria: >
      EICAR测试样本上传后进入隔离区无法被他人获取; 扫描状态对上传者可见。
    trigger_reason: "输入的功能清单中存在文件上传功能「{{feature_name}}」"
    regulatory_ref:
      - file: 信息安全技术 网络安全等级保护基本要求(GB/T 22239-2019)
        clause: 第三级安全通用要求
        summary: 恶意代码防范管理
      - file: 商业银行信息科技风险管理指引
        clause: 参考(银监发〔2009〕19号)
        summary: 信息科技风险控制与运行安全要求
        note: 待合规部门确认具体条文

  - id: SEC-V5-101
    trigger: {type: feature_category, condition: {category: file_download}}
    asvs_ref: "V12.5.1"
    title: 下载接口路径穿越防护与鉴权
    priority: critical
    suggested_phase: development
    description: >
      {{feature_name}}下载接口禁止拼接用户可控路径访问服务器任意文件,
      使用数据库保存的资源ID映射物理路径; 每次下载校验当前用户对该资源的读取授权。
    acceptance_criteria: >
      传入 ../../etc/passwd 类参数无法读出系统文件; A租户/他人资源ID下载被拒绝并记审计日志。
    trigger_reason: "输入的功能清单中存在文件下载功能「{{feature_name}}」"
    regulatory_ref:
      - file: 信息安全技术 网络安全等级保护基本要求(GB/T 22239-2019)
        clause: 第三级安全通用要求
        summary: 访问控制要求
      - file: 网上银行系统信息安全通用规范
        clause: 参考(JR/T 0068-2020)
        summary: 业务交易安全控制
        note: 待合规部门确认具体条文

  - id: SEC-V11-201
    trigger: {type: feature_category, condition: {category: payment}}
    asvs_ref: "V11.1.7"
    title: 支付交易幂等性与防重复提交
    priority: critical
    suggested_phase: design
    description: >
      {{feature_name}}支付接口以业务流水号实现幂等控制, 同一流水号重复提交返回原结果而非二次扣款;
      关键提交按钮前端防抖+服务端分布式锁双重防重。
    acceptance_criteria: >
      同一报文1秒内并发提交10次, 仅产生1笔订单/扣款; 日志中出现明确的幂等命中记录。
    trigger_reason: "输入的功能清单中存在支付交易功能「{{feature_name}}」"
    regulatory_ref:
      - file: 商业银行信息科技风险管理指引
        clause: 参考(银监发〔2009〕19号)
        summary: 电子银行与交易完整性风险控制
        note: 待合规部门确认具体条文
      - file: 金融行业网络安全等级保护实施指引
        clause: 参考(JR/T 0071-2020)
        summary: 金融等保建设与业务连续性要求

  - id: SEC-V5-102
    trigger: {type: feature_category, condition: {category: payment}}
    asvs_ref: "V5.3.4"
    title: 交易金额与关键要素服务端校验
    priority: critical
    suggested_phase: development
    description: >
      交易金额、费率、收款账户等关键要素一律以后端计算结果为准, 不信任任何来自客户端的
      价格/数量字段; 改包修改金额提交时交易被拒绝并告警。
    acceptance_criteria: >
      渗透测试修改金额字段(如0.01元购)交易失败; 报文关键字段参与签名防篡改。
    trigger_reason: "输入的功能清单中存在支付交易功能「{{feature_name}}」"
    regulatory_ref:
      - file: 商业银行信息科技风险管理指引
        clause: 参考(银监发〔2009〕19号)
        summary: 电子银行业务风险控制要求
        note: 待合规部门确认具体条文
      - file: 支付卡行业数据安全标准(PCI DSS v4.0)
        clause: 要求6
        summary: 支付应用系统安全开发要求

  - id: SEC-V11-202
    trigger: {type: feature_category, condition: {category: refund}}
    asvs_ref: "V11.1.4"
    title: 退款额度与审批控制
    priority: critical
    suggested_phase: design
    description: >
      {{feature_name}}退款操作受单笔/日累计额度限制, 超过阈值转入人工审批流程;
      退款账户必须为原支付账户, 禁止退款至变更后的第三方账户。
    acceptance_criteria: >
      超限退款单据自动冻结待审; 更换收款人信息的请求被拒并产生告警日志。
    trigger_reason: "输入的功能清单中存在退款功能「{{feature_name}}」"
    regulatory_ref:
      - file: 商业银行信息科技风险管理指引
        clause: 参考(银监发〔2009〕19号)
        summary: 业务操作风险与审批控制
        note: 待合规部门确认具体条文

  - id: SEC-V4-301
    trigger: {type: feature_category, condition: {category: export_data}}
    asvs_ref: "V4.1.3"
    title: 数据导出权限管控与审计留痕
    priority: high
    suggested_phase: development
    description: >
      {{feature_name}}导出操作仅授予显式申请了导出权限的角色; 每次导出记录
      操作人/时间/导出范围/导出行数/IP, 日志保留期不低于180天满足《网络安全法》要求。
    acceptance_criteria: >
      未授权角色看不到导出入口且直连接口返回403; 任取一条导出记录可在审计平台检索到对应日志。
    trigger_reason: "输入的功能清单中存在数据导出功能「{{feature_name}}」"
    regulatory_ref:
      - file: 中华人民共和国网络安全法
        clause: 第21条
        summary: 采取监测记录网络运行状态的技术措施, 留存网络日志不少于六个月
      - file: 信息安全技术 网络安全等级保护基本要求(GB/T 22239-2019)
        clause: 第三级安全通用要求
        summary: 安全审计要求

  - id: SEC-V8-401
    trigger: {type: feature_category, condition: {category: export_data}}
