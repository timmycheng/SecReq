    priority: high
    suggested_phase: development
    description: >
      短信验证码采用随机6位数字以上, 有效期不超过5分钟, 校验一次即作废;
      验证码在服务端哈希暂存不落明文日志, 错误尝试超过3次即作废该码。
    acceptance_criteria: >
      过期验证码与已用过的验证码再次提交均无效; 后端日志中grep不到验证码明文。
    trigger_reason: "身份认证方式勾选了「短信验证码」"
