        clause: 参考(金规〔2024〕24号)
        summary: 重要数据识别与目录管理
        note: 待合规部门确认具体条文

  - id: SEC-DS5-002
    trigger: {type: data_asset, condition: {level: 5级_重要数据}}
    asvs_ref: "V1.1.1"
