  - id: SEC-EXT-001
    trigger: {type: external_system}
    asvs_ref: "V1.1.2"
    title: 与外部系统「{{system_name}}」对接的边界安全控制
    priority: high
    suggested_phase: design
    description: >
      本系统与外部系统「{{system_name}}」存在{{direction_label}}交互。
      对接边界须明确信任边界与认证方式: 服务端对外部调用方做身份认证与最小授权,
      出站调用配置超时/重试与熔断, 双方交互报文过网关审计并保留可追溯日志。
    acceptance_criteria: >
      1)对接双方采用服务账号+密钥/证书认证, 禁用匿名调用; 2)边界网关配置了调用方白名单与访问控制策略;
      3)对接链路有独立的审计日志留存(含调用方标识)。
    trigger_reason: "向导第1步登记了外部系统「{{system_name}}」({{direction_label}})"
    regulatory_ref:
      - file: 信息安全技术 网络安全等级保护基本要求(GB/T 22239-2019)
        clause: 第三级安全通用要求
        summary: 安全区域边界(边界防护与访问控制)
      - file: 商业银行信息科技风险管理指引
        clause: 参考
        summary: 系统间数据交换与边界管理要求
        note: 待合规部门确认具体条文

  - id: SEC-EXT-002
    trigger: {type: external_system, condition: {sensitive_only: true}}
    asvs_ref: "V1.1.3"
    title: 外部系统「{{system_name}}」敏感数据交互管控
    priority: critical
    suggested_phase: design
    description: >
      本系统与「{{system_name}}」的交互包含敏感数据。传输链路须全程加密并做数据最小化:
      仅传输业务必需字段, 敏感字段在报文中脱敏或加密; 明确数据权属、留存期限与销毁责任,
      交互日志中敏感字段禁止明文落盘。
    acceptance_criteria: >
      1)交互接口清单与字段级映射经数据安全评审; 2)敏感字段加密/脱敏措施已在联调环境验证;
      3)双方协议含数据安全责任与泄露通知条款。
    trigger_reason: "外部系统「{{system_name}}」交互含敏感数据"
    regulatory_ref:
      - file: 个人金融信息保护技术规范
        clause: 参考
        summary: 敏感信息传输与使用限制
        note: 待合规部门确认具体条文
      - file: 中华人民共和国数据安全法
        clause: 第27条
        summary: 数据安全保护义务

