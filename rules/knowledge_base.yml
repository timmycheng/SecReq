        clause: 参考(JR/T 0068-2020)
        summary: 双因素认证要求
        note: 待合规部门确认具体条文

  - id: SEC-V3-001
    trigger: {type: policy_baseline, rule_key: session_timeout}
    asvs_ref: "V3.3.2"
    title: 会话超时与登出失效
    priority: medium
    suggested_phase: development
    description: >
      会话空闲超时时间不超过{{session_timeout_min}}分钟; 用户主动登出或修改密码后,
      服务端立刻注销该用户全部有效Token(JWT黑名单或版本号失效), 不依赖客户端自觉销毁。
    acceptance_criteria: >
      挂起空闲期后刷新页面被踢回登录页; 改密前的旧token继续请求返回401。
    trigger_reason: "依据当前密码策略与定级默认基线"
    regulatory_ref:
      - file: 信息安全技术 网络安全等级保护基本要求(GB/T 22239-2019)
        clause: 第三级安全通用要求
        summary: 会话管理(登录超时自动退出)

