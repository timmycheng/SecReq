    priority: critical
    suggested_phase: test
    description: >
      接口{{api_path}}设置为无需认证。每一个匿名接口都须书面回答: 信息是否均可公开?
      是否可能被恶意批量调用? 并列入渗透测试重点用例, 建议叠加图形验证码或设备指纹风控。
    acceptance_criteria: >
      设计文档存在匿名接口风险评估段落; 脚本1000rps批量调用被拦截图灵识别。
    trigger_reason: "API清单中「{{api_name}}」免认证"
    regulatory_ref:
      - file: 信息安全技术 网络安全等级保护基本要求(GB/T 22239-2019)
        clause: 第三级安全通用要求
        summary: 访问控制与入侵防范

  - id: SEC-V8-405
    trigger: {type: api_endpoint, condition: {touches_sensitive_asset: true}}
    asvs_ref: "V8.3.2"
    title: 敏感接口的报文日志脱敏
    priority: high
    suggested_phase: development
    description: >
      「{{api_name}}」的请求与响应关联资产「{{asset_name}}」, 其网关/APM访问日志、
      链路追踪span、错误堆栈中的报文体都必须经过字段级脱敏后再持久化。
    acceptance_criteria: >
      网关样本日志、Jaeger tracing页面抽查无PII明文; 日志脱敏规则在中间件层统一配置不可绕过。
    trigger_reason: "API清单将该接口关联至敏感资产"
    regulatory_ref:
      - file: 个人金融信息保护技术规范
        clause: 参考(JR/T 0171-2020)
        summary: 个人金融信息报文与日志脱敏
        note: 待合规部门确认具体条文

