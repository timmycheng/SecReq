      登录失败统一返回"用户名或口令错误", 杜绝枚举探测; 解锁验证手段强于正常登录(如人脸/短信双证)。
    acceptance_criteria: >
      使用不存在用户和错口令的响应报文一致; 锁定后爆破请求停止接受。
    trigger_reason: "Step6密码策略设计器输出值"
