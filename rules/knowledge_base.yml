      评估处理活动的重要程度、数据泄露/篡改/滥用风险与安全措施有效性,
      风险评估报告按要求报送并留档三年。
    acceptance_criteria: >
      1)年度风险评估报告已签发; 2)中高风险项有整改计划与责任人; 3)报告按监管要求报送。
    trigger_reason: "数据资产「{{asset_name}}」定为5级(重要数据), 触发年度风险评估义务"
    regulatory_ref:
      - file: 中华人民共和国数据安全法
        clause: 第30条
        summary: 重要数据处理者应当定期开展风险评估并报送评估报告

  - id: SEC-DS5-003
    trigger: {type: data_asset, condition: {level: 5级_重要数据}}
    asvs_ref: "V1.1.1"
    title: 重要数据目录备案
    priority: high
    suggested_phase: design
