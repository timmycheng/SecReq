    description: >
      若启用人脸/指纹认证, 必须带活体检测防止照片视频伪造;
      生物特征原始数据不出设备本地比对, 仅存储特征摘要; 须保留密码兜底因子以防传感器失效锁死用户。
    acceptance_criteria: >
      打印照片攻击被活体检测拒绝; 服务端与网络日志检索不到生物特征原图。
    trigger_reason: "身份认证方式勾选了「生物识别」"
    regulatory_ref:
      - file: 个人金融信息保护技术规范
        clause: 参考(JR/T 0171-2020)
        summary: 生物特征属C3鉴别信息, 存储传输展示从严控制
        note: 待合规部门确认具体条文
      - file: 中华人民共和国个人信息保护法
        clause: 第28条
        summary: 生物识别属敏感个人信息, 处理须充分必要性并采取严格保护措施

  - id: SEC-V2-004
    trigger: {type: policy_baseline, rule_key: force_2fa}
    asvs_ref: "V2.2.1"
    title: 重要用户多因素认证
    priority: high
    suggested_phase: design
    description: >
      项目用户规模{{user_scale}}、当前为{{grading_text}}系统, 管理员及资金操作用户
      强制启用双因素认证(口令+动态令牌/短信/UKey), 不可选择关闭。
    acceptance_criteria: >
      管理后台登录除口令外必须二次验证; 单一因素泄漏时攻击者无法登入管理侧。
    trigger_reason: "定级结果与用户规模达到MFA强制线"
    regulatory_ref:
      - file: 信息安全技术 网络安全等级保护基本要求(GB/T 22239-2019)
        clause: 第三级安全通用要求
        summary: 身份鉴别(两种或以上鉴别技术之一为密码技术)
