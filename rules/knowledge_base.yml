        summary: 加密、去标识化等安全技术措施

  - id: SEC-C3-002
    trigger: {type: data_asset, condition: {c3_tag: true}}
    asvs_ref: "V6.2.1"
    title: C3鉴别信息禁止缓存(含前端CDN)
    priority: critical
    suggested_phase: design
    description: >
      资产「{{asset_name}}」带C3鉴别信息标签。禁止在Redis等缓存、前端CDN/边缘节点、
      浏览器本地存储(含sessionStorage/localStorage)中缓存C3明文或可逆密文;
      响应头设置 no-store 禁止中间层缓存。
    acceptance_criteria: >
      1)缓存键扫描无C3数据; 2)CDN回源日志无C3明文; 3)相关接口响应含 Cache-Control: no-store。
    trigger_reason: "数据资产「{{asset_name}}」标记C3鉴别信息, 禁止缓存(含前端CDN)"
    regulatory_ref:
      - file: 个人金融信息保护技术规范
        clause: 参考(JR/T 0171-2020)
        summary: C3鉴别信息缓存与临时存储限制
        note: 待合规部门确认具体条文

  - id: SEC-C3-003
    trigger: {type: data_asset, condition: {c3_tag: true}}
    asvs_ref: "V7.3.1"
